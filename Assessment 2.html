<html>
    <head>
        <title>Assignment2</title>
    </head>
    <body>
        <h1>Course Sign Up Page</h1>
        <p>Please Note : First Name, Last Name, Password, and Email are required</p>
        <label for="firstName">First Name :</label>
        <input type="text" id="firstName" name="firstName" placeholder="First Name">
        <label for="lastName">Last Name :</label>
        <input type="text" id="lastName" name="lastName" placeholder="Last Name">
        <label for="email">Email :</label>
        <input type="email" id="email" name="email" placeholder="name@example.com">
        <label for="password">Password :</label>
        <input type="password" id="password" name="password">
        <p>Are you over the age of 18?</p>
        <label>Yes :<input type="radio" name="age" value="yes"></label>
        <label>No :<input type="radio" name="age" value="no"></label>
        <p>Do you have a Credit Card or PayPal?</p>
        <select name="paymentmethod">
            <option value="creditcard">Credit Card</option>
            <option value="paypal">PayPal</option>
        </select>
        <button type="submit">Submit Feedback</button>
        <p></p>
        <a href="">Back</a>
        <a href="">Next</a>
    </body>
</html>
